/* ============================================================
   dark-cyber.css — embedded
   ============================================================ */

/* 2. DESIGN TOKENS */
:root {
  --bg:          #0a0a0a;
  --bg-2:        #111111;
  --bg-3:        #161616;
  --card:        #131313;
  --card-hover:  #181818;
  --line:        rgba(255,255,255,0.07);
  --line-strong: rgba(255,255,255,0.14);
  --ink:         #f5f5f4;
  --ink-mid:     #a3a3a3;
  --ink-dim:     #737373;
  --accent:      #c8f76b;
  --accent-dim:  rgba(200,247,107,0.12);
  --accent-glow: rgba(200,247,107,0.18);
  --green:       #22c55e;
  --font-sans:   "Geist", "Inter", system-ui, sans-serif;
  --font-mono:   "Geist Mono", "JetBrains Mono", ui-monospace, monospace;
  --sp-1:  4px; --sp-2:  8px;  --sp-3:  12px; --sp-4:  16px;
  --sp-6:  24px; --sp-8: 32px; --sp-12: 48px; --sp-14: 56px;
  --sp-20: 80px; --sp-25: 100px;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px; --radius-xl: 18px;
  --fs-display: 128px; --fs-h2: 54px; --fs-h3: 32px;
  --fs-body: 16px; --fs-sm: 14px; --fs-xs: 13px;
  --fs-mono: 11px; --fs-mono-sm: 10px;
}

/* 3. BASE */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-sans); font-size: var(--fs-body); line-height: 1.5;
  -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent); color: var(--bg); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.02em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }

/* 4. UTILITIES */
.mono-label { font-family: var(--font-mono); font-size: var(--fs-mono);
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-dim); }
.mono-label--accent { color: var(--accent); }

.card { background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: var(--sp-8);
  transition: background 0.15s, border-color 0.15s; }
.card:hover { background: var(--card-hover); border-color: var(--line-strong); }

.grid-bg {
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 80% 60% at 30% 40%, black, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 30% 40%, black, transparent 70%);
}

.glow { box-shadow: 0 0 0 1px var(--line-strong), 0 30px 80px -20px var(--accent-glow); }

/* 5. NAV */
.nav { position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--sp-4) var(--sp-14);
  background: rgba(10,10,10,0.85); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line); }
.nav__logo { width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); color: var(--bg);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-weight: 700; font-size: 13px; }
.nav__links { display: flex; gap: 32px; font-family: var(--font-mono); font-size: 13px; }
.nav__links a { color: var(--ink-mid); transition: color 0.15s; }
.nav__links a:hover, .nav__links a.active { color: var(--ink); }
.status-pill { display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-mid); }
.status-pill__dot { width: 6px; height: 6px; border-radius: 999px;
  background: var(--green); animation: pulse 1.6s ease-in-out infinite; }

/* 6. BUTTONS */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 22px;
  border: 1px solid transparent; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: transform 0.12s, box-shadow 0.12s, background 0.15s; font-family: var(--font-sans); }
.btn:hover { transform: translateY(-1px); }
.btn--primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn--primary:hover { box-shadow: 0 8px 24px -8px var(--accent-glow); }
.btn--ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.btn--ghost:hover { background: rgba(255,255,255,0.04); }
.btn--sm { padding: 8px 14px; font-size: 13px; border-radius: 8px; }

/* 7. HERO */
.hero { position: relative; overflow: hidden; padding: var(--sp-20) var(--sp-14) var(--sp-14); }
.hero__name { font-size: var(--fs-display); line-height: 0.92; letter-spacing: -0.045em; font-weight: 600; }
.hero__name--accent { color: var(--accent); }
.hero__lede { margin-top: var(--sp-8); font-size: 22px; line-height: 1.4;
  color: var(--ink-mid); max-width: 560px; }
.hero__lede strong { color: var(--ink); font-weight: 500; }

.portrait { position: relative; aspect-ratio: 4/5; border-radius: var(--radius-xl);
  overflow: hidden; background: linear-gradient(135deg, #1a1a1a 0%, #0e0e0e 100%);
  border: 1px solid var(--line-strong); }
.portrait::before { content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 25%, var(--accent-dim), transparent 50%); }
.portrait__bracket { position: absolute; width: 18px; height: 18px; border: 0 solid var(--accent); }
.portrait__bracket--tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; }
.portrait__bracket--tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; }
.portrait__bracket--bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; }
.portrait__bracket--br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; }

/* 8. STATS */
.stats { display: grid; grid-template-columns: repeat(4, 1fr);
  gap: var(--sp-12); padding: var(--sp-12) var(--sp-14);
  background: var(--bg-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat__kicker { font-family: var(--font-mono); font-size: 10px;
  color: var(--accent); letter-spacing: 0.15em; text-transform: uppercase; }
.stat__value { font-size: 56px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; margin-top: 8px; }
.stat__sub { font-size: 13px; color: var(--ink-mid); margin-top: 6px; }

/* 9. SECTIONS */
.section { padding: var(--sp-25) var(--sp-14); }
.section--alt { background: var(--bg-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.section__head { display: grid; grid-template-columns: 180px 1fr;
  gap: var(--sp-12); margin-bottom: var(--sp-12); align-items: baseline; }
.section__title { font-size: var(--fs-h2); letter-spacing: -0.035em; line-height: 1.02; }
.section__sub { margin-top: var(--sp-4); font-size: 18px; color: var(--ink-mid);
  max-width: 680px; line-height: 1.4; }
.section__body { padding-left: 228px; }

/* 10. TIMELINE */
.timeline__row { display: grid; grid-template-columns: 160px 1fr 1fr;
  gap: var(--sp-12); padding: 28px 0; border-top: 1px solid var(--line); align-items: start; }
.timeline__year { font-family: var(--font-mono); font-size: 12px;
  color: var(--ink-dim); letter-spacing: 0.05em; padding-top: 4px; }
.timeline__role { font-size: 22px; margin-bottom: 4px; }
.timeline__org { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.timeline__desc { margin-top: 10px; font-size: 14px; color: var(--ink-mid); line-height: 1.5; }

/* 11. CHIPS */
.chip { display: inline-flex; align-items: center; font-family: var(--font-mono);
  font-size: 11px; padding: 4px 10px; border: 1px solid var(--line);
  border-radius: 999px; color: var(--ink-mid); }
.chip--solid { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
.chip--accent { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }

/* 12. PROJECTS */
.project { display: grid; grid-template-columns: 1fr 1.2fr; gap: 36px; padding: 32px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg);
  align-items: center; }
.project--featured { background: linear-gradient(180deg, var(--card) 0%, var(--bg-2) 100%);
  border-color: var(--line-strong); }
.project__title { font-size: var(--fs-h3); letter-spacing: -0.02em; margin-bottom: 12px; }
.project__blurb { font-size: 15px; color: var(--ink-mid); line-height: 1.55; margin-bottom: 18px; }
.project__metric-value { font-size: 24px; font-weight: 600; color: var(--accent); }
.project__metric-label { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim);
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
.project__cta { display: inline-flex; align-items: center; gap: 6px;
  color: var(--accent); font-size: 14px; font-weight: 500; }
.project__cta:hover { text-decoration: underline; }
.project__visual { position: relative; aspect-ratio: 4/3; border-radius: var(--radius);
  overflow: hidden; background: var(--bg); border: 1px solid var(--line); }

/* 13. WRITING */
.post-row { display: grid; grid-template-columns: 140px 90px 1fr 80px;
  gap: 32px; padding: 24px 0; border-top: 1px solid var(--line);
  align-items: center; color: var(--ink); transition: background 0.15s, padding-left 0.2s;
  cursor: pointer; }
.post-row:hover { background: rgba(255,255,255,0.02); padding-left: 12px; }
.post-row__date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); }
.post-row__title { font-size: 20px; letter-spacing: -0.01em; }
.post-row__meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); text-align: right; }

/* 15. /NOW */
.now-card { position: relative; padding: 36px;
  background: linear-gradient(135deg, var(--card) 0%, var(--bg-2) 100%);
  border: 1px solid var(--line-strong); border-radius: var(--radius-lg); }
.now-card__updated { position: absolute; top: 24px; right: 24px;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.1em; }
.now-card__updated::before { content: ''; width: 6px; height: 6px; border-radius: 999px;
  background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
.now-card__list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.now-card__item { display: flex; gap: 12px; font-size: 15px; align-items: flex-start; }
.now-card__item::before { content: '--'; color: var(--accent); font-family: var(--font-mono); padding-top: 3px; font-size: 12px; }

/* 16. CONTACT */
.contact { position: relative; padding: 120px var(--sp-14) 80px;
  background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
  border-top: 1px solid var(--line); text-align: center; overflow: hidden; }
.contact__heading { font-size: 88px; letter-spacing: -0.04em; line-height: 0.95; }
.contact__heading em { font-style: italic; font-weight: 300; }
.contact__email { display: inline-block; margin-top: 40px; font-size: 44px;
  letter-spacing: -0.02em; color: var(--accent);
  border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.contact__email:hover { background: var(--accent-dim); }

/* 17. FOOTER */
.footer { padding: 40px var(--sp-14); border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg); font-family: var(--font-mono); font-size: 11px;
  color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase; }

/* 18. ANIMATIONS */
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.55; transform: scale(1.25); } }
@keyframes blink { 50% { opacity: 0; } }

/* 19. RESPONSIVE */
@media (max-width: 900px) {
  :root { --fs-display: 64px; --fs-h2: 36px; --fs-h3: 24px; }
  .nav, .hero, .section, .contact, .footer { padding-left: var(--sp-6); padding-right: var(--sp-6); }
  .nav__links { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: var(--sp-6); }
  .section__head { grid-template-columns: 1fr; gap: var(--sp-4); }
  .section__body { padding-left: 0; }
  .timeline__row { grid-template-columns: 1fr; gap: var(--sp-3); }
  .project { grid-template-columns: 1fr; }
  .post-row { grid-template-columns: 1fr; gap: var(--sp-2); padding: var(--sp-4) 0; }
  .contact__heading { font-size: 48px; }
  .contact__email { font-size: 28px; }
}

/* ============================================================
   CUSTOM COMPONENT STYLES
   ============================================================ */

/* Progress bar */
#pbar { position: fixed; top: 0; left: 0; height: 2px;

<script>

{{i18n}}

var lang = localStorage.getItem('mm_lang') || 'en';

function applyLang() {
  var d = lang === 'en' ? EN : SO;
  Object.keys(EN).forEach(function(k) {
    var el = document.getElementById(k);
    if (el) el.innerHTML = d[k] || EN[k];
  });
  document.getElementById('langBtn').textContent = lang === 'en' ? 'SO' : 'EN';
  document.documentElement.lang = lang === 'en' ? 'en' : 'so';
}
applyLang();
function toggleLang() {
  lang = lang === 'en' ? 'so' : 'en';
  localStorage.setItem('mm_lang', lang);
  applyLang();
}

/* Scroll effects */
window.addEventListener('scroll', function() {
  var s = window.scrollY;
  var total = document.body.scrollHeight - window.innerHeight;
  document.getElementById('pbar').style.width = (total > 0 ? (s / total) * 100 : 0) + '%';
  document.getElementById('btt').classList.toggle('show', s > 500);
  document.querySelectorAll('section[id], div[id="contact"]').forEach(function(sec) {
    var top = sec.offsetTop - 100;
    var link = document.querySelector('.nav__links a[href="#' + sec.id + '"]');
    if (link) link.classList.toggle('active', s >= top && s < top + sec.offsetHeight);
  });
});

/* Fade up */
var io = new IntersectionObserver(function(entries) {
  entries.forEach(function(e) { if (e.isIntersecting) e.target.classList.add('on'); });
}, { threshold: 0.07 });
document.querySelectorAll('.fu').forEach(function(el) { io.observe(el); });

/* Blog */
function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}
function readTime(txt) { return Math.max(1, Math.round(((txt || '').split(/\s+/).length) / 200)) + ' min'; }


async function loadBlog() {
  var el = document.getElementById('blogList');
  var section = document.getElementById('writing');
  var navLink = document.querySelector('a[href="#writing"]');
  function hide() { if (section) section.style.display = 'none'; if (navLink) navLink.style.display = 'none'; }
  try {
    var res = await fetch('https://blog.mmohamud.me/feed.json', { cache: 'no-store' });
    if (!res.ok) return hide();
    var posts = (await res.json()).slice(0, 6);
    if (!posts.length) return hide();
    el.textContent = '';
    posts.forEach(function (p) {
      var row = document.createElement('a');
      row.className = 'post-row';
      row.href = p.url;
      var date = document.createElement('div'); date.className = 'post-row__date'; date.textContent = fmtDate(p.date);
      var cat = document.createElement('div'); var chip = document.createElement('span');
      chip.className = 'chip'; chip.textContent = p.topic || 'Blog'; cat.appendChild(chip);
      var title = document.createElement('div'); title.className = 'post-row__title'; title.textContent = p.title;
      var meta = document.createElement('div'); meta.className = 'post-row__meta'; meta.textContent = p.mins + ' min read';
      row.append(date, cat, title, meta);
      el.appendChild(row);
    });
    var all = document.createElement('a');
    all.href = 'https://blog.mmohamud.me';
    all.className = 'project__cta';
    all.style.display = 'inline-flex';
    all.style.marginTop = '24px';
    all.textContent = 'All writing \u2192';
    el.appendChild(all);
  } catch (err) { hide(); }
}
loadBlog();

/* Contact form */
document.getElementById('cForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var form = this, btn = document.getElementById('submitBtn'), orig = btn.textContent;
  var f = form.elements;
  var name = f.name.value.trim(), email = f.email.value.trim(), message = f.message.value.trim();
  if (!name || !email || !message) { btn.textContent = 'Please fill in every field'; setTimeout(function () { btn.textContent = orig; }, 2500); return; }
  btn.textContent = 'Sending...'; btn.style.opacity = '0.7'; btn.disabled = true;
  var cfg = window.BLOG_CFG || {}, saved = false, mailed = false;
  try {
    var r = await fetch(cfg.url + '/rest/v1/messages', {
      method: 'POST',
      headers: { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ source: 'contact', name: name.slice(0, 120), email: email, body: message.slice(0, 5000), site: 'mmohamud.me' })
    });
    saved = r.ok;
  } catch (err) {}
  try {
    var m = await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
    mailed = m.ok;
  } catch (err) {}
  if (saved || mailed) { form.reset(); document.getElementById('formOk').style.display = 'block'; btn.textContent = 'Sent'; }
  else { btn.textContent = 'Try Again'; }
  btn.style.opacity = '1'; btn.disabled = false;
  setTimeout(function () { btn.textContent = orig; }, 4000);
});
</script>
